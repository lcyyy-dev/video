<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GainingCut</title>
<link rel="icon" type="image/png" href="../../../packages/openfilm/studio/ui/src/assets/brand-logo.png">
<script>
  /* the theme before the first paint, so the wrong one never flashes: dark unless the person chose another */
  (function () {
    var t = 'dark';
    try { t = localStorage.getItem('openfilm.theme') || 'dark'; } catch (e) {}
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
    /* OpenFilm is currently delivered as a Chinese-first product. Keep Studio and
       the assistant on the same language before either tree renders. */
    try { localStorage.setItem('openfilm.language', 'zh-CN'); } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<!-- the chat's column beside Studio (the panel Studio leaves room for), and its layer for what floats. Both are
     Studio's host panel (its keys leave them alone) and take focus: a click anywhere in the chat, not only in its
     fields, keeps the keyboard in the chat (Space, Delete, ⌘A there never reach Studio). -->
<div id="of-chat" class="of-chat" data-studio-host-panel tabindex="-1"></div>
<div id="of-chat-layer" class="of-chat" data-studio-host-panel tabindex="-1"></div>
<script type="module" src="./main.tsx"></script>
</body>
</html>
