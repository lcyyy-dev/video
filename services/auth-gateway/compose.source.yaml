# Run updated source with an existing Node image, without building.
# Dependencies must first be installed with npm ci in this directory.
services:
  gateway:
    volumes:
      - ./server.mjs:/app/server.mjs:ro
      - ./logs.mjs:/app/logs.mjs:ro
      - ./log-fields.mjs:/app/log-fields.mjs:ro
      - ./log-store.mjs:/app/log-store.mjs:ro
      - ./tts.mjs:/app/tts.mjs:ro
      - ./node_modules:/app/node_modules:ro
  admin:
    volumes:
      - ./admin.mjs:/app/admin.mjs:ro
      - ./admin.html:/app/admin.html:ro
      - ./admin-ui.js:/app/admin-ui.js:ro
      - ./logs.mjs:/app/logs.mjs:ro
      - ./log-fields.mjs:/app/log-fields.mjs:ro
      - ./log-store.mjs:/app/log-store.mjs:ro
      - ./node_modules:/app/node_modules:ro
  monitor:
    volumes:
      - ./monitor.mjs:/app/monitor.mjs:ro
      - ./logs.mjs:/app/logs.mjs:ro
      - ./log-fields.mjs:/app/log-fields.mjs:ro
      - ./log-store.mjs:/app/log-store.mjs:ro
      - ./node_modules:/app/node_modules:ro
  log-init:
    volumes:
      - ./log-db.mjs:/app/log-db.mjs:ro
      - ./legacy-logs.mjs:/app/legacy-logs.mjs:ro
      - ./log-store.mjs:/app/log-store.mjs:ro
      - ./log-fields.mjs:/app/log-fields.mjs:ro
      - ./node_modules:/app/node_modules:ro
