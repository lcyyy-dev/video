services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keygen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: keygen
    volumes:
      - keygen-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keygen"]
      interval: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  keygen:
    image: keygen/api:latest
    restart: unless-stopped
    command: web
    env_file: .env.keygen
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    image: keygen/api:latest
    restart: unless-stopped
    command: worker
    env_file: .env.keygen
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  keygen-postgres:
